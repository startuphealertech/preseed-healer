# Sample Nginx site for preseedhealer.com (VPS + PM2).
# Get certificates first:  sudo certbot --nginx -d preseedhealer.com -d www.preseedhealer.com

server {
  listen 80;
  server_name preseedhealer.com www.preseedhealer.com;
  return 301 https://preseedhealer.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.preseedhealer.com;
  ssl_certificate     /etc/letsencrypt/live/preseedhealer.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preseedhealer.com/privkey.pem;
  return 301 https://preseedhealer.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name preseedhealer.com;

  ssl_certificate     /etc/letsencrypt/live/preseedhealer.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preseedhealer.com/privkey.pem;

  client_max_body_size 10m;   # image uploads (MAX_UPLOAD_MB=5) with headroom
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Everything goes to Next.js; Next proxies /api/v1/* to the Express API on :4000.
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (don't append): Next passes this header to the API unchanged and the API
    # rate-limits on it, so a client-supplied value must never survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Long-lived caching for hashed build assets.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
